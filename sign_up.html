<!DOCTYPE html>
<html>
    <head>
        <title> Sign Up </title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body class="sign_up">
        <div id="S">
            <h1> Sign Up </h1>
            <form>
                <input class="name" placeholder=" Enter Name" type="text" required>
                <br>
                <input class="email" placeholder="Enter Email" type="email" required>
                <br>
                <input class="password" placeholder="Enter Password" type="Password" required>
                <br>
                <button type="submit"> Sign up </button>
            </form>
        </div>
    </body>
</html>
